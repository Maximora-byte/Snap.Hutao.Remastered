name: Snap Hutao Remastered Canary
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - release
      - dependabot/**
    paths-ignore:
      - '.gitattributes'
      - '.github/**'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - '**.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge all branches into dev locally
        id: merge
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = '${{ github.repository }}'

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed with exit code $LASTEXITCODE" }

          git checkout origin/dev
          if ($LASTEXITCODE -ne 0) { throw "git checkout origin/dev failed with exit code $LASTEXITCODE" }

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept        = 'application/vnd.github+json'
          }
          try {
              $pulls = Invoke-RestMethod -Uri "https://api.github.com/repos/$repository/pulls?state=open&per_page=100" -Headers $headers
          }
          catch {
              throw "Cannot list open pull requests of $repository (rate limited or insufficient permissions): $($_.Exception.Message)"
          }

          $refs = @()
          foreach ($pull in $pulls) {
              if ($pull.draft) { continue }
              if ($pull.head.repo.full_name -ne $repository) {
                  Write-Host "Skipping #$($pull.number): head branch lives in $($pull.head.repo.full_name), not in $repository"
                  continue
              }
              $refs += $pull.head.ref
          }

          if ($refs.Count -eq 0 -or ($refs.Count -eq 1 -and $refs[0] -eq 'l10n_dev')) {
              Write-Host "No PRs to merge"
              "continue=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }

          foreach ($ref in $refs) {
              Write-Host "Merging $ref into dev"
              git merge "origin/$ref" --strategy=ort --allow-unrelated-histories -m "Merge $ref into dev"
              if ($LASTEXITCODE -ne 0) {
                  throw "Merging origin/$ref into dev failed with exit code $LASTEXITCODE"
              }
          }

          "continue=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        if: ${{ steps.merge.outputs.continue == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11

      - name: Cache NuGet packages
        if: ${{ steps.merge.outputs.continue == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Snap.Hutao.Remastered.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cake (MSIX)
        if: ${{ steps.merge.outputs.continue == 'true' }}
        id: cake
        shell: pwsh
        run: dotnet tool restore && dotnet cake
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Build installer
        if: ${{ steps.merge.outputs.continue == 'true' }}
        id: installer
        shell: pwsh
        run: dotnet cake build-installer.cake
        env:
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          PW: ${{ secrets.PW }}

      - name: Upload signed msix
        if: ${{ success() && steps.merge.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Canary-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/src/output/Snap.Hutao.Remastered.Canary-${{ steps.cake.outputs.version }}.msix

      - name: Upload installer
        if: ${{ success() && steps.merge.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Canary-Setup-${{ steps.cake.outputs.version }}
          path: ${{ github.workspace }}/publish/Snap.Hutao.Remastered-*.exe

      - name: Upload code-signing certificate
        if: ${{ success() && steps.merge.outputs.continue == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: Snap.Hutao.Remastered.Canary-SnapHutaoRemasteringProject-${{ steps.installer.outputs.version }}
          path: ${{ github.workspace }}/temp-code-signing.cer

      - name: Add summary
        if: ${{ success() && steps.merge.outputs.continue == 'true' }}
        shell: pwsh
        run: |
          $summary = "
          > [!WARNING]
          > 该版本是由 CI 程序自动打包生成的 Canary 测试版本，包含新功能原型及问题修复

          > [!IMPORTANT]
          > 直接旁加载 MSIX 时，请将 SnapHutaoRemasteringProject 工件中的证书安装到 **受信任的人员（TrustedPeople）** 存储
          "

          echo $summary >> $Env:GITHUB_STEP_SUMMARY
